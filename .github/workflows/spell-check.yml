name: Spell Check

on:
  # Manual only: chip names, register names and abbreviations produce more
  # false alarms here than findings.
  workflow_dispatch:

jobs:
  spellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      # See: https://github.com/codespell-project/actions-codespell/blob/master/README.md
      - name: Spell check
        uses: codespell-project/actions-codespell@master
        with:
          check_filenames: true
          check_hidden: true
          skip: "./.git,./avr/travis-ci/etc/*,./avr/travis-ci/arduino-ci-script/*,./avr/extras/ioheaders/*,*.log,*.py,*.gif,*.jpg,*.png"
          # In the event of a false positive, add the word in all lower case to this file:
          ignore_words_file: avr/extras/ci/codespell-ignore-words-list.txt
