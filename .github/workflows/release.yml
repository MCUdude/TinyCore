# Releasing the core: the checks first, then the mechanical part.
#
# Push a tag and this does the rest:
#
#     git tag v0.9.1-rc1 && git push origin v0.9.1-rc1   # a candidate to try out
#     git tag v0.9.1     && git push origin v0.9.1       # the real thing
#
# A tag carrying -rc is published as a pre-release and goes into an index of its
# own, so it never reaches an ordinary board manager. Nothing is published unless
# the checks and every compilation have passed.
#
# The checks are the workflows this repository already has, called rather than
# copied: each of them gained a 'workflow_call' trigger and is otherwise
# untouched. Left out are the checks that would fail for reasons a release
# cannot help -- formatting, spelling, and the link checker, which depends on
# other people's servers being up.
#
# compile-examples is left out for a different reason: its FQBNs name the
# packager ATTinyCore and board IDs like attinyx5, which this core does not have
# -- its boards are x5, x4, x41 and so on. It cannot pass here as it stands.
# Once it can, one line adds it to the list below.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write          # to create the release and to push to gh-pages

jobs:
  version:
    name: The tag matches the core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with avr/platform.txt
        run: |
          # A candidate is checked against the version it is a candidate for:
          # v0.9.1-rc2 belongs to 0.9.1, so trying one out does not mean
          # touching the version number for every attempt.
          TAG="${GITHUB_REF_NAME#v}"
          WANT="${TAG%%-*}"
          HAVE="$(sed -n 's/^version=//p' avr/platform.txt)"
          echo "the tag says ${WANT}, avr/platform.txt says ${HAVE}"
          test "$WANT" = "$HAVE"

  lint:
    uses: ./.github/workflows/arduino-lint.yml
  keywords:
    uses: ./.github/workflows/check-keywords-txt.yml
  library-properties:
    uses: ./.github/workflows/check-library-properties.yml
  library-structure:
    uses: ./.github/workflows/check-library-structure.yml

  publish:
    name: Publish
    needs: [version, lint, keywords, library-properties, library-structure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creating the release and adding it to the index are two steps, and
          # only the second one can fail in ways worth retrying. So skip this
          # when the release is already there, and a re-run of the job works.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "the release already exists, leaving it alone"
            exit 0
          fi
          PRE=""
          case "${GITHUB_REF_NAME}" in *-rc*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
             --generate-notes $PRE

      - name: Check out the branch that carries the index
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Which index does this tag belong in?
        run: |
          case "${GITHUB_REF_NAME}" in
            *-rc*) INDEX=package_MCUdude_TinyCore_rc_index.json ;;
            *)     INDEX=package_MCUdude_TinyCore_index.json ;;
          esac
          echo "INDEX_FILE=$INDEX" >> "$GITHUB_ENV"
          echo "This tag goes into ${INDEX}"

      - name: Create the candidate index if there is none yet
        working-directory: pages
        run: |
          # The first candidate would otherwise fail on a file that nobody has
          # created. A copy of the released index is the right starting point:
          # it carries the tools and lets a tester go back to a final version.
          if [ ! -f "$INDEX_FILE" ]; then
            cp package_MCUdude_TinyCore_index.json "$INDEX_FILE"
            echo "created ${INDEX_FILE} from the released index"
          fi

      - name: Offer the current avrdude
        working-directory: pages
        run: |
          # Adds the newest avrdude release to the index when it is not there
          # yet, and says so and stops when it is. Has to run before the core
          # entry, which depends on the newest avrdude the index knows.
          bash Add_avrdude_release.sh

      - name: Offer the current debugging tools
        working-directory: pages
        run: |
          # Has to run, not just may: Boards_manager_release.sh takes the
          # PyAvrOCD version from the same API this script does, not from the
          # index, so leaving this out makes the next step abort as soon as a
          # newer PyAvrOCD exists. And a new version of the debugging tools is
          # the most common reason for a release of the core in the first place.
          bash Add_avrocd-tools_release.sh

      - name: Add this version to the board manager index
        working-directory: pages
        run: |
          sleep 20          # give the release a moment to become visible to the API
          bash Boards_manager_release.sh "${GITHUB_REF_NAME}"

      - name: Commit and push the index
        working-directory: pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The index already knew about this version"
            exit 0
          fi
          git commit -m "${GITHUB_REF_NAME}"
          git push
