# Checks the core itself rather than the libraries around it: that boards.txt,
# platform.txt and the variants still agree with each other, that every board
# and every option that can change the binary really compiles, and that the
# prebuild hook picks the '#pragma arduino' lines out of a sketch.
#
# Three scripts in extras/ do the work, and each of them runs by hand just as
# well as it runs here:
#
#     python3 extras/check_core.py  --root avr
#     python3 extras/compile_all.py --root avr --fqbn-prefix TinyCore:avr
#     python3 extras/check_hooks.py --root avr --fqbn TinyCore:avr:x5:chip=85
#
# The release workflow calls this one, so nothing is published that did not
# pass here.

name: Check the core

on:
  pull_request:
    paths:
      - ".github/workflows/check-core.yml"
      - "extras/*.py"
      - "avr/*.txt"
      - "avr/cores/**"
      - "avr/variants/**"
      - "avr/scripts/**"
  push:
    paths:
      - ".github/workflows/check-core.yml"
      - "extras/*.py"
      - "avr/*.txt"
      - "avr/cores/**"
      - "avr/variants/**"
      - "avr/scripts/**"
  # workflow_dispatch event allows the workflow to be triggered manually
  # See: https://docs.github.com/en/actions/reference/events-that-trigger-workflows#workflow_dispatch
  workflow_dispatch:
  # repository_dispatch event allows the workflow to be triggered via the GitHub API
  # See: https://docs.github.com/en/actions/reference/events-that-trigger-workflows#repository_dispatch
  repository_dispatch:
  # workflow_call lets another workflow wait for these checks. The release
  # workflow passes the tag it is about, which is checked as well then.
  workflow_call:
    inputs:
      tag:
        description: "the release this is run for, if it is run for one"
        type: string
        required: false

jobs:
  consistency:
    name: Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Do boards.txt, platform.txt and the variants agree?
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # With a tag it also says whether the core is ready to be released
          # under that version: the CHANGELOG, package.json and the tag itself.
          if [ -n "$TAG" ]; then
            python3 extras/check_core.py --root avr --tag "$TAG"
          else
            python3 extras/check_core.py --root avr
          fi

  compile:
    name: Compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: consistency

    strategy:
      fail-fast: false          # one platform failing should not hide the others
      # An ordinary push gets the Linux runner. The other two differ in their
      # hook scripts and their paths rather than in their compiler, and that is
      # worth the three runners when a release is at stake or someone asks.
      matrix:
        os: ${{ (github.event_name == 'push' || github.event_name == 'pull_request')
                && fromJSON('["ubuntu-latest"]')
                || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}

    defaults:
      run:
        shell: bash             # also on Windows, where the hooks are .bat anyway

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: TinyCore

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: arduino/setup-arduino-cli@v2

      - name: Keep Defender out of the build (Windows only)
        if: runner.os == 'Windows'
        continue-on-error: true      # a speed-up, not a requirement
        shell: pwsh
        run: |
          # A build writes thousands of small object files and the real-time
          # scanner opens every one of them. A parameter can only be given once,
          # so the several paths go in as one array.
          Add-MpPreference -ExclusionPath @("$HOME\Arduino with blank",
                                            "$HOME\work with blank",
                                            "$env:LOCALAPPDATA\Arduino15")
          Add-MpPreference -ExclusionProcess @("avr-gcc.exe", "avr-g++.exe",
                                               "avr-ar.exe", "avr-objcopy.exe",
                                               "avr-objdump.exe")
          Get-MpPreference | Select-Object -ExpandProperty ExclusionPath

      - name: Put the core where arduino-cli finds it
        run: |
          set -x
          arduino-cli version
          # The blank is deliberate: {runtime.platform.path} ends up in every
          # recipe and in the hook scripts, and an unquoted use of it only shows
          # when the path has one. Naming the directory ourselves is safer than
          # asking arduino-cli, whose 'config get' does not exist everywhere.
          SKETCHBOOK="$HOME/Arduino with blank"
          arduino-cli config init --overwrite
          arduino-cli config set directories.user "$SKETCHBOOK"
          mkdir -p "$SKETCHBOOK/hardware/TinyCore"
          cp -r TinyCore/avr "$SKETCHBOOK/hardware/TinyCore/avr"
          test -f "$SKETCHBOOK/hardware/TinyCore/avr/boards.txt" \
            || { echo "the core did not end up where it belongs"; exit 1; }
          arduino-cli core update-index              # nothing is installable without it
          arduino-cli core install arduino:avr       # for the toolchain the core uses
          arduino-cli core list
          arduino-cli board listall | head -20

      - name: Compile
        run: |
          # Every board, and of the menus those that can change the binary.
          python TinyCore/extras/compile_all.py --root TinyCore/avr \
                 --fqbn-prefix TinyCore:avr \
                 --work-dir "$HOME/work with blank" --timeout 300

      - name: Check that the prebuild hook picks up the pragmas
        run: |
          # The hook fails silently by nature: the options file stays empty and
          # the build succeeds without the flags. So it gets a sketch of its own.
          python TinyCore/extras/check_hooks.py --root TinyCore/avr \
                 --fqbn TinyCore:avr:x5:chip=85 \
                 --work-dir "$HOME/work with blank"
